<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Guessing Game</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#667085;--accent:#4f46e5;--good:#16a34a;--bad:#dc2626;--line:#e4e7ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2f;--text:#eef0f8;--muted:#9aa3bd;--accent:#818cf8;--good:#4ade80;--bad:#f87171;--line:#2a3050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2f;--text:#eef0f8;--muted:#9aa3bd;--accent:#818cf8;--good:#4ade80;--bad:#f87171;--line:#2a3050;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-size:20px;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);font-size:13px;text-align:center;margin:0 0 16px}
.stats{display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px}
.word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.word span{width:26px;height:36px;border-bottom:3px solid var(--accent);text-align:center;font-size:24px;font-weight:700;text-transform:uppercase}
.hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.lives{text-align:center;font-size:18px;letter-spacing:3px;margin-bottom:6px}
.tried{text-align:center;font-size:13px;color:var(--muted);min-height:18px;margin-bottom:10px}
.msg{text-align:center;min-height:22px;font-size:14px;font-weight:600;margin-bottom:10px}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button.full{width:100%;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Word Guessing Game</h1>
  <p class="sub">Web preview of the Java project · OOP through Java</p>
  <div class="stats"><span id="player">Player: Guest</span><span id="score">Score: 0</span></div>
  <div class="hint" id="hint"></div>
  <div class="word" id="word"></div>
  <div class="lives" id="lives"></div>
  <div class="tried" id="tried"></div>
  <div class="msg" id="msg"></div>
  <div class="row" id="inputRow">
    <input id="guess" type="text" placeholder="Letter or full word" autocomplete="off" autocapitalize="none">
    <button id="go">Guess</button>
  </div>
  <button class="full hidden" id="again">Play again</button>
</div>
<script>
// Mirrors the Java classes: Word, WordBank, GameRound, Player
const MAX = 6;
const BANK = [
  ["java","A popular programming language"],
  ["class","Blueprint of an object"],
  ["object","Instance of a class"],
  ["inheritance","Acquiring properties of a parent class"],
  ["interface","Contains abstract methods, implemented by classes"],
  ["polymorphism","One name, many forms"],
  ["encapsulation","Wrapping data and methods together"],
  ["constructor","Special method that initializes an object"],
  ["exception","An unwanted event during program execution"],
  ["package","Group of related classes"]
];
class InvalidGuessException extends Error {}
class GameRound {
  constructor([text, hint]) {
    this.text = text; this.hint = hint;
    this.display = Array(text.length).fill("_");
    this.tried = new Set(); this.left = MAX; this.note = "";
  }
  processGuess(raw) {
    const g = raw.trim().toLowerCase();
    if (!g) throw new InvalidGuessException("Input cannot be empty.");
    if (!/^[a-z]+$/.test(g)) throw new InvalidGuessException("Use alphabets only.");
    if (g.length === 1) return this.guessLetter(g);
    if (g.length === this.text.length) return this.guessWord(g);
    throw new InvalidGuessException("Enter one letter or the full word (" + this.text.length + " letters).");
  }
  guessLetter(ch) {
    if (this.tried.has(ch)) throw new InvalidGuessException("You already tried ’" + ch + "’.");
    this.tried.add(ch);
    let found = false;
    [...this.text].forEach((c, i) => { if (c === ch) { this.display[i] = ch; found = true; } });
    if (!found) this.left--;
    return found ? ["Good guess!", "good"] : ["Wrong guess!", "bad"];
  }
  guessWord(g) {
    if (g === this.text) { this.display = [...this.text]; return ["Good guess!", "good"]; }
    this.left--; return ["That is not the word!", "bad"];
  }
  get won() { return this.display.join("") === this.text; }
  get lost() { return this.left <= 0; }
  get over() { return this.won || this.lost; }
  calculateScore() { return this.left * 10 + this.text.length; }
}

let round, total = 0;
const $ = id => document.getElementById(id);
function show(msg, cls) { $("msg").textContent = msg; $("msg").className = "msg " + (cls || ""); }
function render() {
  $("hint").textContent = "Hint: " + round.hint;
  $("word").innerHTML = round.display.map(c => "<span>" + (c === "_" ? "" : c) + "</span>").join("");
  $("lives").textContent = "♥".repeat(round.left) + "♡".repeat(MAX - round.left);
  $("tried").textContent = round.tried.size ? "Tried: " + [...round.tried].join(", ") : "";
  $("score").textContent = "Score: " + total;
}
function newRound() {
  round = new GameRound(BANK[Math.floor(Math.random() * BANK.length)]);
  $("inputRow").classList.remove("hidden"); $("again").classList.add("hidden");
  show(""); render(); $("guess").value = ""; $("guess").focus();
}
function submit() {
  if (round.over) return;
  try {
    const [m, c] = round.processGuess($("guess").value);
    show(m, c);
  } catch (e) {
    if (!(e instanceof InvalidGuessException)) throw e;
    show("Invalid: " + e.message, "bad");
  }
  $("guess").value = "";
  if (round.over) {
    if (round.won) { const p = round.calculateScore(); total += p; show("Correct! You earned " + p + " points.", "good"); }
    else { round.display = [...round.text]; show("Game over! The word was ’" + round.text + "’.", "bad"); }
    $("inputRow").classList.add("hidden"); $("again").classList.remove("hidden");
  }
  render();
}
$("go").onclick = submit;
$("guess").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
$("again").onclick = newRound;
newRound();
</script>
</body>
</html>
